<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>patch-review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/review.css">
</head>
<body>

<header id="topbar">
  <a href="/" id="topbar-title" style="color:inherit;text-decoration:none;">patch-review</a>
  <span id="patch-name"></span>
  <span id="revision-badge" class="hidden"></span>
  <div id="interdiff-controls" class="hidden">
    <label style="font-size:12px;color:#8b949e;">Compare:</label>
    <select id="interdiff-from" title="From revision"></select>
    <span style="font-size:12px;color:#8b949e;">→</span>
    <select id="interdiff-to" title="To revision"></select>
    <button id="btn-interdiff" class="small">Interdiff</button>
    <button id="btn-full-diff" class="small hidden">Full diff</button>
  </div>
  <div id="view-toggle" class="hidden">
    <button id="btn-unified" class="active">Unified</button>
    <button id="btn-split">Split</button>
  </div>
  <span id="comment-stats" class="hidden"></span>
  <button id="btn-upload-revision" class="small">Upload revision</button>
  <input type="file" id="revision-file-input" accept=".patch,.diff">
  <button id="btn-clear-resolved" class="small danger hidden">Clear resolved</button>
</header>

<div id="review-layout">
  <div id="diff-panel"></div>
  <div id="comment-sidebar">
    <div id="sidebar-header">
      <span>Comments</span>
      <button id="btn-reload" class="small" title="Reload comments from server">↻</button>
    </div>
    <div id="comment-list">
      <div id="empty-sidebar">Click any line number in the diff to add a comment.</div>
    </div>
  </div>
</div>

<script>
  // ── State ────────────────────────────────────────────────────────────────
  const reviewId = window.location.pathname.split('/')[2];
  const API = `/reviews/${reviewId}`;

  let diffFiles = [];
  let comments = [];
  let currentRevision = 1;
  let viewMode = 'unified'; // 'unified' | 'split'
  let activeInputRow = null;
  let interdiffMode = false;

  // ── API ──────────────────────────────────────────────────────────────────
  async function apiGetDiff(fromRevision = null, toRevision = null) {
    let url = `${API}/diff`;
    if (fromRevision !== null && toRevision !== null) {
      url += `?from_revision=${fromRevision}&to_revision=${toRevision}`;
    }
    const r = await fetch(url);
    if (!r.ok) return null;
    return r.json();
  }

  async function apiGetComments() {
    const r = await fetch(`${API}/comments`);
    if (!r.ok) return { comments: [] };
    return r.json();
  }

  async function apiAddComment(file, line, lineContent, text) {
    const r = await fetch(`${API}/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file, line, line_content: lineContent, comment: text }),
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  async function apiSetResolved(id, resolved) {
    const r = await fetch(`${API}/comments/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resolved }),
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  async function apiDeleteComment(id) {
    const r = await fetch(`${API}/comments/${id}`, { method: 'DELETE' });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  async function apiUploadRevision(file) {
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch(`${API}/revisions`, { method: 'POST', body: fd });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  // ── Helpers ──────────────────────────────────────────────────────────────
  function commentsFor(file, line) {
    return comments.filter(c => c.file === file && c.line === line);
  }

  function updateStats() {
    const total = comments.length;
    const unresolved = comments.filter(c => !c.resolved).length;
    const resolved = total - unresolved;
    const statsEl = document.getElementById('comment-stats');
    const clearBtn = document.getElementById('btn-clear-resolved');

    if (total === 0) {
      statsEl.classList.add('hidden');
      clearBtn.classList.add('hidden');
      return;
    }
    statsEl.classList.remove('hidden');
    statsEl.innerHTML =
      `<span class="stat-unresolved">${unresolved} unresolved</span>` +
      (resolved ? ` · <span class="stat-resolved">${resolved} resolved</span>` : '');
    clearBtn.classList.toggle('hidden', resolved === 0);
  }

  // ── Comment input ────────────────────────────────────────────────────────
  function closeCommentInput() {
    if (activeInputRow) {
      activeInputRow.remove();
      activeInputRow = null;
    }
  }

  function openCommentInput(file, line, lineContent, afterRow) {
    if (interdiffMode) return;
    closeCommentInput();

    const tr = document.createElement('tr');
    tr.className = 'comment-input-row';
    const td = document.createElement('td');
    td.colSpan = 10;

    const form = document.createElement('div');
    form.className = 'comment-form';

    const textarea = document.createElement('textarea');
    textarea.placeholder = 'Add a review comment…';

    const hint = document.createElement('div');
    hint.className = 'form-hint';
    hint.textContent = '⌘↵ or Ctrl↵ to submit · Esc to cancel';

    const buttons = document.createElement('div');
    buttons.className = 'form-buttons';

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'cancel small';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', closeCommentInput);

    const submitBtn = document.createElement('button');
    submitBtn.className = 'primary small';
    submitBtn.textContent = 'Add comment';
    submitBtn.addEventListener('click', async () => {
      const text = textarea.value.trim();
      if (!text) return;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving…';
      try {
        await apiAddComment(file, line, lineContent, text);
        closeCommentInput();
        await reloadComments();
      } catch (e) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add comment';
        alert('Failed to save comment: ' + e.message);
      }
    });

    textarea.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submitBtn.click();
      if (e.key === 'Escape') cancelBtn.click();
    });

    buttons.appendChild(cancelBtn);
    buttons.appendChild(submitBtn);
    form.appendChild(textarea);
    form.appendChild(hint);
    form.appendChild(buttons);
    td.appendChild(form);
    tr.appendChild(td);

    // Insert after afterRow, skipping any existing comment rows for that line
    let insertAfter = afterRow;
    while (
      insertAfter.nextElementSibling &&
      insertAfter.nextElementSibling.classList.contains('comment-row')
    ) {
      insertAfter = insertAfter.nextElementSibling;
    }
    insertAfter.insertAdjacentElement('afterend', tr);
    activeInputRow = tr;
    textarea.focus();
  }

  // ── Inline comment row ───────────────────────────────────────────────────
  function makeInlineCommentRow(c, colSpan) {
    const tr = document.createElement('tr');
    tr.className = 'comment-row';
    tr.dataset.commentId = c.id;
    const td = document.createElement('td');
    td.colSpan = colSpan;

    const div = document.createElement('div');
    div.className = `inline-comment${c.resolved ? ' resolved' : ''}`;

    const text = document.createElement('div');
    text.className = 'ic-text';
    text.textContent = c.comment;
    if (c.revision && c.revision < currentRevision) {
      const tag = document.createElement('span');
      tag.className = 'rev-tag';
      tag.textContent = `rev ${c.revision}`;
      text.appendChild(tag);
    }
    div.appendChild(text);

    if (c.resolution_note) {
      const note = document.createElement('div');
      note.className = 'ic-note';
      note.textContent = '✓ ' + c.resolution_note;
      div.appendChild(note);
    }

    const meta = document.createElement('div');
    meta.className = 'ic-meta';
    if (c.resolved && c.resolved_at) {
      const ts = document.createElement('span');
      ts.textContent = 'resolved ' + new Date(c.resolved_at).toLocaleString();
      meta.appendChild(ts);
    }
    const resolveBtn = document.createElement('button');
    resolveBtn.className = 'small';
    resolveBtn.textContent = c.resolved ? 'Unresolve' : 'Resolve';
    resolveBtn.addEventListener('click', async () => {
      await apiSetResolved(c.id, !c.resolved);
      await reloadComments();
    });
    meta.appendChild(resolveBtn);
    div.appendChild(meta);

    td.appendChild(div);
    tr.appendChild(td);
    return tr;
  }

  // ── Unified diff rendering ───────────────────────────────────────────────
  function renderUnified(file, container) {
    const table = document.createElement('table');
    table.className = 'diff-table';
    const fileName = file.new_file || file.old_file;

    for (const hunk of file.hunks) {
      const hunkRow = document.createElement('tr');
      hunkRow.className = 'hunk-hdr';
      const hunkTd = document.createElement('td');
      hunkTd.colSpan = 4;
      hunkTd.textContent = hunk.header;
      hunkRow.appendChild(hunkTd);
      table.appendChild(hunkRow);

      for (const ln of hunk.lines) {
        // Removed lines use a negative old-line number as the comment key
        const commentKey = ln.type === 'removed' ? -(ln.old_line) : ln.new_line;
        const row = document.createElement('tr');
        row.className = `ln-${ln.type}`;
        row.dataset.file = fileName;
        row.dataset.line = commentKey;

        const tdOld = document.createElement('td');
        if (ln.type === 'removed') {
          tdOld.className = 'ln ln-click';
          tdOld.title = 'Add comment';
          tdOld.addEventListener('click', () =>
            openCommentInput(fileName, commentKey, ln.content, row)
          );
        } else {
          tdOld.className = 'ln';
        }
        tdOld.textContent = ln.old_line ?? '';

        const tdNew = document.createElement('td');
        tdNew.textContent = ln.new_line ?? '';
        if (ln.type !== 'removed') {
          tdNew.className = 'ln ln-click';
          tdNew.title = 'Add comment';
          tdNew.addEventListener('click', () =>
            openCommentInput(fileName, commentKey, ln.content, row)
          );
        } else {
          tdNew.className = 'ln';
        }

        const tdSign = document.createElement('td');
        tdSign.className = 'sign';
        tdSign.textContent = ln.type === 'added' ? '+' : ln.type === 'removed' ? '-' : ' ';

        const tdCode = document.createElement('td');
        tdCode.className = 'code';
        tdCode.textContent = ln.content;

        row.appendChild(tdOld);
        row.appendChild(tdNew);
        row.appendChild(tdSign);
        row.appendChild(tdCode);
        table.appendChild(row);

        for (const c of commentsFor(fileName, commentKey)) {
          table.appendChild(makeInlineCommentRow(c, 4));
        }
      }
    }
    container.appendChild(table);
  }

  // ── Split diff rendering ─────────────────────────────────────────────────
  function renderSplit(file, container) {
    const table = document.createElement('table');
    table.className = 'split-table';
    const fileName = file.new_file || file.old_file;

    for (const hunk of file.hunks) {
      const hunkRow = document.createElement('tr');
      hunkRow.className = 'hunk-hdr';
      const hunkTd = document.createElement('td');
      hunkTd.colSpan = 7;
      hunkTd.textContent = hunk.header;
      hunkRow.appendChild(hunkTd);
      table.appendChild(hunkRow);

      // Group consecutive removed/added lines into pairs
      let i = 0;
      const lines = hunk.lines;
      while (i < lines.length) {
        const ln = lines[i];

        if (ln.type === 'context') {
          const row = document.createElement('tr');
          const lineNum = ln.new_line ?? ln.old_line;

          const tdOldLn = mkTd('ln', ln.old_line ?? '');
          const tdOldSign = mkTd('sign', ' ');
          const tdOldCode = mkTd('code', ln.content);
          tdOldCode.parentElement; // not appended yet

          const tdDivider = document.createElement('td');
          tdDivider.className = 'split-divider';

          const tdNewLn = mkTd('ln ln-click', ln.new_line ?? '');
          tdNewLn.title = 'Add comment';
          tdNewLn.addEventListener('click', () =>
            openCommentInput(fileName, lineNum, ln.content, row)
          );
          const tdNewSign = mkTd('sign', ' ');
          const tdNewCode = mkTd('code', ln.content);

          // Apply background via class on cells
          [tdOldLn, tdOldSign, tdOldCode].forEach(el => el.classList.add('split-old'));
          [tdNewLn, tdNewSign, tdNewCode].forEach(el => el.classList.add('split-new'));

          row.appendChild(tdOldLn);
          row.appendChild(tdOldSign);
          row.appendChild(tdOldCode);
          row.appendChild(tdDivider);
          row.appendChild(tdNewLn);
          row.appendChild(tdNewSign);
          row.appendChild(tdNewCode);
          table.appendChild(row);

          for (const c of commentsFor(fileName, lineNum)) {
            table.appendChild(makeInlineCommentRow(c, 7));
          }
          i++;

        } else if (ln.type === 'removed' || ln.type === 'added') {
          // Collect the block of removed then added lines
          const removed = [];
          const added = [];
          while (i < lines.length && lines[i].type === 'removed') {
            removed.push(lines[i++]);
          }
          while (i < lines.length && lines[i].type === 'added') {
            added.push(lines[i++]);
          }

          const blockLen = Math.max(removed.length, added.length);
          for (let j = 0; j < blockLen; j++) {
            const rem = removed[j];
            const add = added[j];
            const row = document.createElement('tr');

            if (rem) {
              row.appendChild(mkTd('ln split-old', rem.old_line ?? ''));
              row.appendChild(mkTd('sign split-old has-content', '-'));
              row.appendChild(mkTd('code split-old has-content', rem.content));
            } else {
              row.appendChild(mkTd('ln split-old', ''));
              row.appendChild(mkTd('sign split-old', ''));
              row.appendChild(mkTd('code split-old', ''));
            }

            const tdDivider = document.createElement('td');
            tdDivider.className = 'split-divider';
            row.appendChild(tdDivider);

            if (add) {
              const lineNum = add.new_line ?? add.old_line;
              const tdNewLn = mkTd('ln split-new has-content ln-click', add.new_line ?? '');
              tdNewLn.title = 'Add comment';
              tdNewLn.addEventListener('click', () =>
                openCommentInput(fileName, lineNum, add.content, row)
              );
              row.appendChild(tdNewLn);
              row.appendChild(mkTd('sign split-new has-content', '+'));
              row.appendChild(mkTd('code split-new has-content', add.content));

              table.appendChild(row);
              for (const c of commentsFor(fileName, lineNum)) {
                table.appendChild(makeInlineCommentRow(c, 7));
              }
            } else {
              // Removed-only row: make old line number clickable
              const commentKey = -(rem.old_line);
              const tdOldLn = row.children[0]; // already appended above
              tdOldLn.classList.add('ln-click');
              tdOldLn.title = 'Add comment';
              tdOldLn.addEventListener('click', () =>
                openCommentInput(fileName, commentKey, rem.content, row)
              );
              row.appendChild(mkTd('ln split-new', ''));
              row.appendChild(mkTd('sign split-new', ''));
              row.appendChild(mkTd('code split-new', ''));
              table.appendChild(row);
              for (const c of commentsFor(fileName, commentKey)) {
                table.appendChild(makeInlineCommentRow(c, 7));
              }
            }
          }
        } else {
          i++;
        }
      }
    }
    container.appendChild(table);
  }

  function mkTd(className, text) {
    const td = document.createElement('td');
    td.className = className;
    td.textContent = text;
    return td;
  }

  // ── Main render ──────────────────────────────────────────────────────────
  function renderDiff() {
    const panel = document.getElementById('diff-panel');
    panel.innerHTML = '';

    for (const file of diffFiles) {
      const block = document.createElement('div');
      block.className = 'file-block';

      const header = document.createElement('div');
      header.className = 'file-header';
      header.textContent = file.new_file || file.old_file;
      block.appendChild(header);

      if (viewMode === 'unified') {
        renderUnified(file, block);
      } else {
        renderSplit(file, block);
      }

      panel.appendChild(block);
    }
  }

  function renderSidebar() {
    const list = document.getElementById('comment-list');
    const empty = document.getElementById('empty-sidebar');
    list.innerHTML = '';

    if (comments.length === 0) {
      list.appendChild(empty);
      return;
    }

    for (const c of comments) {
      const div = document.createElement('div');
      div.className = `sc${c.resolved ? ' resolved' : ''}`;
      div.title = 'Click to jump to line';
      div.addEventListener('click', () => scrollToLine(c.file, c.line));

      const loc = document.createElement('div');
      loc.className = 'sc-loc';
      loc.textContent = c.line < 0
        ? `${c.file}:old:${-c.line}`
        : `${c.file}:${c.line}`;

      const text = document.createElement('div');
      text.className = 'sc-text';
      text.textContent = c.comment;
      if (c.revision && c.revision < currentRevision) {
        const tag = document.createElement('span');
        tag.className = 'rev-tag';
        tag.textContent = `rev ${c.revision}`;
        text.appendChild(tag);
      }

      div.appendChild(loc);
      div.appendChild(text);

      if (c.resolution_note) {
        const note = document.createElement('div');
        note.className = 'sc-note';
        note.textContent = '✓ ' + c.resolution_note;
        div.appendChild(note);
      }

      const actions = document.createElement('div');
      actions.className = 'sc-actions';
      const resolveBtn = document.createElement('button');
      resolveBtn.className = 'small';
      resolveBtn.textContent = c.resolved ? 'Unresolve' : 'Resolve';
      resolveBtn.addEventListener('click', async e => {
        e.stopPropagation();
        await apiSetResolved(c.id, !c.resolved);
        await reloadComments();
      });
      actions.appendChild(resolveBtn);
      div.appendChild(actions);

      list.appendChild(div);
    }
  }

  function scrollToLine(file, line) {
    const row = document.querySelector(
      `[data-file="${CSS.escape(file)}"][data-line="${line}"]`
    );
    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // ── Interdiff ─────────────────────────────────────────────────────────────
  async function loadInterdiff(fromRevision, toRevision) {
    const diffData = await apiGetDiff(fromRevision, toRevision);
    if (!diffData) { alert('Failed to load interdiff.'); return; }
    interdiffMode = true;
    diffFiles = diffData.files;
    document.getElementById('btn-interdiff').classList.add('hidden');
    document.getElementById('btn-full-diff').classList.remove('hidden');
    document.getElementById('revision-badge').textContent = `rev ${fromRevision} → ${toRevision}`;
    document.getElementById('comment-stats').classList.add('hidden');
    closeCommentInput();
    renderDiff();
  }

  async function exitInterdiffMode() {
    interdiffMode = false;
    document.getElementById('btn-full-diff').classList.add('hidden');
    document.getElementById('btn-interdiff').classList.remove('hidden');
    const diffData = await apiGetDiff();
    if (!diffData) return;
    diffFiles = diffData.files;
    document.getElementById('revision-badge').textContent = `rev ${currentRevision}`;
    closeCommentInput();
    renderDiff();
    renderSidebar();
    updateStats();
  }

  // ── Data loading ─────────────────────────────────────────────────────────
  async function reloadComments() {
    const data = await apiGetComments();
    comments = data.comments || [];
    renderDiff();
    renderSidebar();
    updateStats();
  }

  async function loadAll() {
    interdiffMode = false;
    const [diffData, reviewData] = await Promise.all([apiGetDiff(), apiGetComments()]);
    if (!diffData) return;

    diffFiles = diffData.files;
    comments = reviewData.comments || [];
    currentRevision = reviewData.revisions ? reviewData.revisions.length : 1;

    const latest = reviewData.revisions?.[reviewData.revisions.length - 1];
    if (latest) {
      document.getElementById('patch-name').textContent = latest.patch_file;
      const badge = document.getElementById('revision-badge');
      badge.textContent = `rev ${currentRevision}`;
      badge.classList.remove('hidden');
    }

    if (reviewData.revisions && reviewData.revisions.length >= 2) {
      const total = reviewData.revisions.length;
      const fromSel = document.getElementById('interdiff-from');
      const toSel = document.getElementById('interdiff-to');
      fromSel.innerHTML = '';
      toSel.innerHTML = '';
      for (let n = 1; n <= total; n++) {
        const o = document.createElement('option');
        o.value = n; o.textContent = `rev ${n}`;
        fromSel.appendChild(o.cloneNode(true));
        toSel.appendChild(o);
      }
      fromSel.value = total - 1;
      toSel.value = total;
      document.getElementById('interdiff-controls').classList.remove('hidden');
      document.getElementById('btn-full-diff').classList.add('hidden');
      document.getElementById('btn-interdiff').classList.remove('hidden');
    }

    document.getElementById('view-toggle').classList.remove('hidden');
    document.getElementById('btn-upload-revision').style.display = '';
    renderDiff();
    renderSidebar();
    updateStats();
  }

  // ── Event wiring ─────────────────────────────────────────────────────────
  document.getElementById('btn-unified').addEventListener('click', () => {
    viewMode = 'unified';
    document.getElementById('btn-unified').classList.add('active');
    document.getElementById('btn-split').classList.remove('active');
    closeCommentInput();
    renderDiff();
  });

  document.getElementById('btn-split').addEventListener('click', () => {
    viewMode = 'split';
    document.getElementById('btn-split').classList.add('active');
    document.getElementById('btn-unified').classList.remove('active');
    closeCommentInput();
    renderDiff();
  });

  document.getElementById('btn-reload').addEventListener('click', reloadComments);

  document.getElementById('btn-clear-resolved').addEventListener('click', async () => {
    if (!confirm('Delete all resolved comments?')) return;
    const resolved = comments.filter(c => c.resolved);
    await Promise.all(resolved.map(c => apiDeleteComment(c.id)));
    await reloadComments();
  });

  document.getElementById('btn-upload-revision').addEventListener('click', () => {
    document.getElementById('revision-file-input').click();
  });

  document.getElementById('revision-file-input').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const btn = document.getElementById('btn-upload-revision');
    btn.textContent = 'Uploading…';
    btn.disabled = true;
    try {
      await apiUploadRevision(file);
      await loadAll();
    } finally {
      btn.textContent = 'Upload revision';
      btn.disabled = false;
      e.target.value = '';
    }
  });

  document.getElementById('btn-interdiff').addEventListener('click', () => {
    const from = parseInt(document.getElementById('interdiff-from').value, 10);
    const to = parseInt(document.getElementById('interdiff-to').value, 10);
    if (from === to) { alert('Choose two different revisions.'); return; }
    loadInterdiff(from, to);
  });

  document.getElementById('btn-full-diff').addEventListener('click', exitInterdiffMode);

  // ── Boot ─────────────────────────────────────────────────────────────────
  loadAll();
</script>

</body>
</html>
