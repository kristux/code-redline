<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>patch-review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/home.css">
</head>
<body>

<header>
  <h1>patch-review</h1>
</header>

<main>
  <div id="drop-zone">
    <strong>Drop a patch file to start a new review</strong>
    <p>or click to browse &nbsp;·&nbsp; accepts any unified diff (.patch, .diff)</p>
  </div>
  <input type="file" id="file-input" accept=".patch,.diff">

  <div class="top-row">
    <h2>Reviews</h2>
  </div>

  <div id="review-list">
    <div id="empty-state" class="hidden">
      <strong>No reviews yet</strong>
      <p>Upload a patch file above to create the first one.</p>
    </div>
  </div>
</main>

<script>
  async function loadReviews() {
    const r = await fetch('/reviews');
    const reviews = await r.json();
    const list = document.getElementById('review-list');
    const empty = document.getElementById('empty-state');

    // Remove existing cards (keep empty state element)
    [...list.querySelectorAll('.review-card')].forEach(el => el.remove());

    if (reviews.length === 0) {
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    for (const rv of reviews) {
      const a = document.createElement('a');
      a.className = 'review-card';
      a.href = rv.url;

      const name = document.createElement('span');
      name.className = 'rc-name';
      name.textContent = rv.patch_file || rv.id;

      const date = document.createElement('span');
      date.className = 'rc-date';
      date.textContent = rv.created_at
        ? new Date(rv.created_at).toLocaleString()
        : '';

      if (rv.revision_count > 1) {
        const rev = document.createElement('span');
        rev.className = 'rc-badge no-comments';
        rev.textContent = `${rv.revision_count} revisions`;
        a.appendChild(rev);
      }

      const badge = document.createElement('span');
      badge.className = 'rc-badge';
      if (rv.comment_count === 0) {
        badge.textContent = 'No comments';
        badge.classList.add('no-comments');
      } else if (rv.unresolved_count > 0) {
        badge.textContent = `${rv.unresolved_count} unresolved`;
        badge.classList.add('has-unresolved');
      } else {
        badge.textContent = 'All resolved';
        badge.classList.add('all-resolved');
      }

      a.appendChild(name);
      a.appendChild(date);
      a.appendChild(badge);
      list.appendChild(a);
    }
  }

  async function createReview(file) {
    const dz = document.getElementById('drop-zone');
    dz.classList.add('uploading');
    dz.querySelector('strong').textContent = 'Uploading…';
    try {
      const fd = new FormData();
      fd.append('file', file);
      const r = await fetch('/reviews', { method: 'POST', body: fd });
      if (!r.ok) throw new Error(await r.text());
      const data = await r.json();
      window.location.href = data.url;
    } catch (e) {
      dz.classList.remove('uploading');
      dz.querySelector('strong').textContent = 'Drop a patch file to start a new review';
      alert('Upload failed: ' + e.message);
    }
  }

  // Drop zone
  const dz = document.getElementById('drop-zone');
  dz.addEventListener('click', () => document.getElementById('file-input').click());
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) createReview(e.dataTransfer.files[0]);
  });
  document.getElementById('file-input').addEventListener('change', e => {
    if (e.target.files[0]) createReview(e.target.files[0]);
  });

  loadReviews();
</script>

</body>
</html>
